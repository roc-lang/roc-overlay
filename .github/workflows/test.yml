name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        uses: cachix/install-nix-action@9280e7aca88deada44c930f1e2c78e21c3ae3edd # v31.7.0

      - name: Check formatting
        run: nix fmt -- --check

      - name: Evaluate all systems
        run: nix flake check --all-systems --no-build

      - name: Check native system
        run: nix flake check

      - name: Run Roc
        run: nix run . -- version

      - name: Test updater
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          env -u NIX_PATH ./update.sh
          unexpected=$(git status --porcelain | sed 's/^...//' | grep -v '^sources.json$' || true)
          if [ -n "$unexpected" ]; then
            echo "unexpected files changed:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
