# SECURITY: This workflow runs untrusted code from outside contribution (fork) PRs (update.sh, flake evaluation).
# Never add secrets or write permissions here. If a secret is ever needed
# (e.g. a Cachix push token), put it in a separate workflow triggered only
# on `push` to master, after the code is trusted.
name: Test

# `push` is limited to the default branch so that a branch with an open PR does
# not run the suite twice. Post-merge runs on master matter: the automated
# metadata PR is opened with GITHUB_TOKEN and therefore never triggers CI
# itself, so this is where merged updates get verified in place.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      - name: Check formatting
        run: nix fmt -- --check

      - name: Evaluate all systems
        run: nix flake check --all-systems --no-build

      - name: Check on native system
        run: nix flake check

      - name: Run Roc
        run: nix run . -- version

      - name: Test updater
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          env -u NIX_PATH ./update.sh
          unexpected=$(git status --porcelain | sed 's/^...//' | grep -v '^sources.json$' || true)
          if [ -n "$unexpected" ]; then
            echo "unexpected files changed:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
