name: Update nightly metadata

on:
  ##schedule:
  ##  - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-nightly-metadata
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        uses: cachix/install-nix-action@9280e7aca88deada44c930f1e2c78e21c3ae3edd # v31.7.0

      - name: Update and validate metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./update.sh

      - name: Commit metadata
        run: |
          git diff --exit-code -- . ':(exclude)sources.json'
          git add sources.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name roc-nightly-overlay
          git config user.email roc-nightly-overlay@users.noreply.github.com
          git commit -m "chore: update Roc nightly metadata"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
